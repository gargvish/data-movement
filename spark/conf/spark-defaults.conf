# Packages pulled on first spark-submit / spark-sql invocation.
# Cached under /root/.ivy2 (persisted via docker volume).
spark.jars.packages                               org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.6.1,org.apache.iceberg:iceberg-aws-bundle:1.6.1,org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,org.apache.hadoop:hadoop-aws:3.3.4

# Enables Iceberg-specific SQL syntax: CALL procedures, MERGE INTO, etc.
spark.sql.extensions                              org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

# Catalog named "demo" — backed by the REST catalog service.
spark.sql.catalog.demo                            org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.demo.type                       rest
spark.sql.catalog.demo.uri                        http://iceberg-rest:8181
spark.sql.catalog.demo.io-impl                    org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.demo.s3.endpoint                http://rustfs:9000
spark.sql.catalog.demo.s3.path-style-access       true
spark.sql.catalog.demo.s3.access-key-id           rustfsadmin
spark.sql.catalog.demo.s3.secret-access-key       rustfsadmin
spark.sql.catalog.demo.client.region              us-east-1

# Default to the "demo" catalog so queries don't need to prefix with demo.
spark.sql.defaultCatalog                          demo

# Hadoop S3A — used only for Structured Streaming checkpoints (s3a://warehouse/_checkpoints/...).
# Iceberg data uses S3FileIO above and does not go through this stack.
spark.hadoop.fs.s3a.endpoint                      http://rustfs:9000
spark.hadoop.fs.s3a.access.key                    rustfsadmin
spark.hadoop.fs.s3a.secret.key                    rustfsadmin
spark.hadoop.fs.s3a.path.style.access             true
spark.hadoop.fs.s3a.connection.ssl.enabled        false
spark.hadoop.fs.s3a.aws.credentials.provider      org.apache.hadoop.fs.s3a.SimpleAWSCredentialsProvider
